<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | MECHWORLD</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/account.css"><script src="js/auth.js" defer></script></head>
<body class="account-body"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">M<span>W</span></span><span class="brand-name">MECH<span>WORLD</span><small>ENGINEERING • DESIGN • INNOVATION</small></span></a><a class="button button-small" href="index.html">← Back to site</a></div></header>
<main class="account-wrap"><section class="account-card"><div class="eyebrow">MECHWORLD MEMBER AREA</div><h1 id="authHeading">Welcome <span>back.</span></h1><p class="muted">Create an account to save projects and engineering calculation history.</p><div class="auth-tabs"><button type="button" class="active" id="loginTab">Log in</button><button type="button" id="registerTab">Create account</button></div>
<form id="authForm"><div id="nameWrap" hidden><label for="name">Your name</label><input id="name" name="name" autocomplete="name" minlength="2" maxlength="80" placeholder="Akash Kumar"></div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"><button class="button" id="submitAuth" type="submit">Log in <span>↗</span></button><p class="form-status" id="authStatus" role="status"></p></form><p class="small-note">Use a unique password. This starter stores password hashes, never plain-text passwords.</p></section></main><footer class="account-footer">© <span id="year"></span> MECHWORLD · Created by Akash</footer></body></html>
